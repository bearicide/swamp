<style>:root{--bg:#07110b;--mud:#132219;--slime:#65ff84;--fog:#9bb59f;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Bahnschrift,Arial,sans-serif;background:radial-gradient(circle at top,rgba(101,255,132,.18),transparent 30%),linear-gradient(180deg,#020403,#07110b 40%,#0f1a12);color:#eef7ef;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.015) 2px 4px);pointer-events:none;opacity:.4}.panel{width:min(900px,calc(100% - 28px));padding:32px;border:1px solid var(--line);border-radius:28px;background:rgba(7,17,11,.78);backdrop-filter:blur(14px);box-shadow:0 0 80px rgba(0,0,0,.45)}h1{margin:0;font-size:clamp(3rem,10vw,7rem);letter-spacing:.12em;line-height:.9;color:var(--slime);text-shadow:0 0 18px rgba(101,255,132,.45)}p{max-width:760px;line-height:1.6;color:var(--fog)}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}a{text-decoration:none;color:#021006;background:var(--slime);padding:10px 14px;border-radius:12px;font-weight:900;text-transform:uppercase;font-size:.82rem}.small{margin-top:28px;font-size:.75rem;opacity:.65;letter-spacing:.08em;text-transform:uppercase}@media(max-width:700px){.panel{padding:20px}a{width:100%;text-align:center}}</style>
